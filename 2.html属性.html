<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

        p {
            color:rgb(66, 212, 212);

</head>
<body>
    <div class="av">
    <h1>HTML 属性示例</h1>

    <span>
     这是b站链接🔗:<a href="https://www.bilibili.com/" target="_blank" rel="noopener">哔哩哔哩干杯</a></style>

    <br />

    <br />
    <img src="Invicon_Cookie.png" title="这是饼干图标" alt="A cookie icon with a bite taken out of the top right corner; the cookie is light brown with darker brown chocolate chips scattered across its surface; the background is transparent" width="50" />`

    <input type="text"  placeholder="请输入内容" />

    <label for="">性别</label>
